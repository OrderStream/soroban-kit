[package]
name = "soroban-kit"
version = "0.1.0"
edition = "2021"
authors = ["OrderStream <healthdecoded77@gmail.com>"]
description = "Production-ready security utilities, sliding-window event deduplication, and fixed-point math safeguards for Stellar Soroban smart contracts."
license = "MIT OR Apache-2.0"
repository = "https://github.com/OrderStream/soroban-kit"
readme = "README.md"
keywords = ["stellar", "soroban", "smart-contracts", "defi", "security"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0", default-features = false }
ed25519-dalek = "=2.2.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
